<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G-1 SHOP</title>
    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./src/css/styles.css">
  </head>

<body>
  <header class="bg-white shadow-sm sticky-top">
    <nav class="container navbar py-3 d-flex align-items-center justify-content-between position-relative">
        <div style="width: 40px;"></div>

        <!-- Titulo -->
        <a class="navbar-brand fw-bold tracking-wider text-uppercase mx-auto" href="#">G-1 SHOP</a>
        
        <!-- Carrito -->
        <button class="btn btn-outline-dark border-0 position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
            <i class="bi bi-cart3 fs-5"></i>
            <span class="position-absolute top-0 end-0 translate-middle-y badge rounded-pill bg-danger d-none" id="cart-badge">0</span>
        </button>
    </nav>
  </header>

  <main class = "container">
    <!-- Buscador -->
    <div class="row justify-content-center mb-4">
          <div class="col-md-8">
              <div class="input-group shadow-sm">
                  <input type = "text" name = "search" id="search-bar" class="form-control" placeholder="Buscar">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              </div>
          </div>
    </div>

    <!-- Filtro por categorias -->
    <div class="d-flex justify-content-center flex-wrap gap-2 mb-4" id="category-filter">
        <!-- Logica de categorias por JS -->
    </div>

    <!-- Lista de productos -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4" id="product-list">
    </div>

    <!-- Modal -->
    <div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modalLabel" aria-hidden="true">
    </div>   

    <!-- Lista de productos en carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasRightLabel">Productos en Carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <!-- Logica de lista de productos por JS  -->
      </div>
    </div>  
      
  </main>

  <!-- Notificaciones -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <footer>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="./src/index.js"></script>

</body>
</html>
