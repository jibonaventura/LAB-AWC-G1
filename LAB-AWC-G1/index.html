<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="G-1 SHOP, tienda online de productos con carrito de compras.">
    <title>G-1 SHOP</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./src/css/styles.css">
  </head>

<body>
  <header class="bg-white shadow-sm sticky-top">
    <nav class="container navbar py-3 d-flex align-items-center justify-content-between" aria-label="Barra de navegacion principal">
        <div style="width: 40px;"></div>

        <!-- Titulo -->
        <h1 class="navbar-brand fw-bold text-uppercase fs-4 m-0 mx-auto">G-1 SHOP</h1>

        <!-- Carrito -->
        <button class="btn btn-outline-dark border-0 position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight" aria-label="Abrir carrito de compras">
            <i class="bi bi-cart3 fs-5" aria-hidden="true"></i>
            <span class="position-absolute top-0 end-0 translate-middle-y badge rounded-pill bg-danger d-none" id="cart-badge">0</span>
        </button>
    </nav>
  </header>

  <main class="container py-4">
    <!-- Buscador -->
    <section class="mb-4" aria-labelledby="buscador-titulo">
        <h2 class="visually-hidden" id="buscador-titulo">Buscar productos</h2>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <label for="search-bar" class="visually-hidden">Buscar productos por nombre</label>
                <div class="input-group shadow-sm">
                    <input type="search" name="search" id="search-bar" class="form-control" placeholder="Buscar producto...">
                    <span class="input-group-text bg-white"><i class="bi bi-search" aria-hidden="true"></i></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Filtro por categorias -->
    <section class="mb-4" aria-labelledby="categorias-titulo">
        <h2 class="visually-hidden" id="categorias-titulo">Filtrar por categoria</h2>
        <nav aria-label="Navegacion por categorias">
            <ul class="nav justify-content-center flex-wrap gap-2 list-unstyled" id="category-filter">
                <!-- Logica de categorias por JS -->
            </ul>
        </nav>
    </section>

    <!-- Lista de productos -->
    <section aria-labelledby="productos-titulo">
        <h2 class="visually-hidden" id="productos-titulo">Listado de productos</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4" id="product-list">
            <!-- Logica de productos por JS -->
        </div>
    </section>

    <!-- Modal -->
    <div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modalLabel" aria-hidden="true">
    </div>

    <!-- Formulario de compra -->
    <div class="modal fade" id="checkout-modal" tabindex="-1" aria-labelledby="checkout-modalLabel" aria-hidden="true">
    </div>

    <!-- Lista de productos en carrito -->
    <aside class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title fs-5" id="offcanvasRightLabel">Productos en Carrito</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar carrito"></button>
      </div>
      <div class="offcanvas-body">
        <!-- Logica de lista de productos por JS -->
      </div>
    </aside>
  </main>

  <!-- Notificaciones -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <footer class="bg-white border-top mt-5 py-4">
    <div class="container text-center text-muted">
        <p class="mb-1 fw-semibold">G-1 SHOP</p>
        <p class="mb-0 small">Trabajo practico - Laboratorio de Aplicaciones Web Cliente</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="./src/index.js"></script>

    <!-- Contenedor para el modal de checkout --> 
  <div class="modal fade" id="checkout-modal" tabindex="-1" aria-hidden="true"></div> 

 </body>
</html>
